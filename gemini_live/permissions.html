<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetTranslate AI - Permiso de Micrófono</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --accent-color: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .icon-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px auto;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-allow {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, background 0.2s;
    }

    .btn-allow:hover {
      background: linear-gradient(135deg, #059669, #047857);
    }

    .btn-allow:active {
      transform: scale(0.98);
    }

    .status-msg {
      margin-top: 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-msg.success {
      color: #34d399;
    }

    .status-msg.error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-box">🎙️</div>
    <h1>Permiso de Micrófono Requerido</h1>
    <p>Para traducir tu voz en tiempo real durante tus reuniones de Google Meet, Zoom y Teams, necesitamos acceso a tu micrófono.</p>
    
    <button type="button" class="btn-allow" id="btn-allow-mic">
      <span>🎙️ Activar Micrófono</span>
    </button>

    <div class="status-msg" id="status-msg"></div>
  </div>

  <script src="permissions.js"></script>
</body>
</html>
