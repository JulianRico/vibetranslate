<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViBeTranslate: subtítulos</title>
  <style>
    /* Mismo aspecto que la ventana principal: letra de Windows (sin descargar fuentes), fondo oscuro sobrio y la
       traducción en blanco, que es lo que se lee. */
    :root {
      --mt-font-size: 18px;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      user-select: none;
    }

    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    .overlay-card {
      width: 100%;
      height: 100%;
      background: rgba(28, 28, 31, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      padding: 8px 14px 10px;
      gap: 6px;
    }

    .drag-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      cursor: move;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #d6d7db;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8a8d96;
    }

    .lang-badge {
      font-size: 12px;
      color: #8a8d96;
    }

    .controls-no-drag {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .btn-action {
      background: transparent;
      border: none;
      color: #b4b6bd;
      font-size: 12px;
      font-weight: 600;
      min-width: 26px;
      height: 24px;
      padding: 0 4px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .btn-action:focus-visible {
      outline: 2px solid #4cc2ff;
      outline-offset: 1px;
    }

    .btn-action.btn-close:hover {
      background: rgba(255, 107, 92, 0.3);
    }

    .subtitle-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
    }

    /* Frases anteriores, atenuadas, para no perder el hilo */
    .sub-history {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sub-history-line {
      font-size: calc(var(--mt-font-size) * 0.72);
      color: #b4b6bd;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-original {
      font-size: calc(var(--mt-font-size) * 0.75);
      color: #9a9da5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-translated {
      font-family: var(--font-display);
      font-size: var(--mt-font-size);
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
      word-break: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="overlay-card" id="overlay-card">
    <div class="drag-bar">
      <div class="badge-group">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>Subtítulos</span>
        </div>
        <div class="lang-badge" id="lang-pair">ES ➔ EN</div>
      </div>

      <div class="controls-no-drag">
        <button type="button" class="btn-action" id="btn-font-dec" title="Letra más pequeña" aria-label="Letra más pequeña">A−</button>
        <button type="button" class="btn-action" id="btn-font-inc" title="Letra más grande" aria-label="Letra más grande">A+</button>
        <button type="button" class="btn-action" id="btn-minimize" title="Solo la última frase" aria-label="Solo la última frase">_</button>
        <button type="button" class="btn-action btn-close" id="btn-close-overlay" title="Ocultar los subtítulos (Ctrl+Shift+T)" aria-label="Ocultar los subtítulos">✕</button>
      </div>
    </div>

    <div class="subtitle-area">
      <div class="sub-history" id="sub-history"></div>
      <div class="sub-original" id="sub-original"></div>
      <div class="sub-translated" id="sub-translated">Los subtítulos aparecerán aquí.</div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
