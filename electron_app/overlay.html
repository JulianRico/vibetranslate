<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetTranslate Subtítulos Flotantes</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    :root {
      --mt-font-size: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
    }

    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    .overlay-card {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.2);
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Drag Handle Bar */
    .drag-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      cursor: move;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #34d399;
      background: rgba(16, 185, 129, 0.2);
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .lang-badge {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .controls-no-drag {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    .btn-action.btn-close:hover {
      background: rgba(239, 68, 68, 0.5) !important;
      color: #fee2e2 !important;
    }

    /* Subtitle Content Area */
    .subtitle-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }

    .sub-original {
      font-size: calc(var(--mt-font-size) * 0.75);
      color: #94a3b8;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-translated {
      font-size: var(--mt-font-size);
      font-weight: 700;
      color: #34d399;
      line-height: 1.3;
      word-break: break-word;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="overlay-card" id="overlay-card">
    <div class="drag-bar">
      <div class="badge-group">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>LIVE DESKTOP AI</span>
        </div>
        <div class="lang-badge" id="lang-pair">ES ➔ EN</div>
      </div>

      <div class="controls-no-drag">
        <button type="button" class="btn-action" id="btn-font-dec" title="Reducir tamaño de letra">A-</button>
        <button type="button" class="btn-action" id="btn-font-inc" title="Aumentar tamaño de letra">A+</button>
        <button type="button" class="btn-action" id="btn-minimize" title="Minimizar">_</button>
        <button type="button" class="btn-action btn-close" id="btn-close-overlay" title="Apagar / Ocultar Recuadro Flotante (Ctrl+Shift+T)">✕</button>
      </div>
    </div>

    <div class="subtitle-area">
      <div class="sub-original" id="sub-original">Escuchando reunión...</div>
      <div class="sub-translated" id="sub-translated">Listening to meeting audio...</div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
